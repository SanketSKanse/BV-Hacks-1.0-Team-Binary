<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Complaint - Smart Complaint Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="logo">
            <h2>CMS</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="./user.html" class="nav-link" id="dashboardLink">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="./newcomplaint.html" class="nav-link active" id="newComplaintLink">
                    <i class="fas fa-plus-circle"></i>
                    <span>New Complaint</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="./mycomplaints.html" class="nav-link" id="complaintsLink">
                    <i class="fas fa-list"></i>
                    <span>My Complaints</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="profileLink">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="logoutLink">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h1>New Complaint</h1>
            <div class="user-profile">
                <div class="user-avatar">JS</div>
                <span>John Smith</span>
            </div>
        </div>

        <div class="complaint-form-container">
            <div class="complaint-form">
                <div class="form-section">
                    <h2>File a New Complaint</h2>
                    <form id="complaintForm">
                        <div class="form-group">
                            <label for="complaintCategory">Complaint Category</label>
                            <select id="complaintCategory" class="form-control" required>
                                <option value="">Select a category</option>
                                <option value="Infrastructure">Infrastructure</option>
                                <option value="IT Support">IT Support</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Security">Security</option>
                                <option value="Academics">Academics</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="complaintDescription">Complaint Description</label>
                            <textarea id="complaintDescription" class="form-control" placeholder="Describe your complaint in detail. Be as specific as possible about the issue, location, and when it started..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Priority Level</label>
                            <div class="priority-tags">
                                <span class="priority-tag low" data-priority="low">Low</span>
                                <span class="priority-tag medium" data-priority="medium">Medium</span>
                                <span class="priority-tag high" data-priority="high">High</span>
                            </div>
                            <input type="hidden" id="priority" name="priority" required>
                        </div>

                        <button type="submit" class="btn btn-submit">Submit Complaint</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="../scripts/newcomplaint.js"></script>
</body>
</html>
