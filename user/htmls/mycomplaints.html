<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - Smart Complaint Management System</title>
    <link rel="stylesheet" href="/user/styles/styles.css">
    <link rel="stylesheet" href="/admin/styles/admin2.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">CMS</div>
            <ul class="sidebar-menu" id="sidebar-menu">
                <li><a href="/user/htmls/user.html" >Dashboard</a></li>
                <li><a href="/user/htmls/newcomplaint.html">New Complaints</a></li>
                <li><a href="/user/htmls/mycomplaints.html">My Complaints</a></li>
                <li><a href="/user/htmls/profile.html">Profile</a></li>
                <li><a href="/user/htmls/settings.html">Settings</a></li>
                <li><a href="#logout" >Logout</a></li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>My Complaints</h1>
            <div class="user-profile">
                <div class="user-avatar">JS</div>
                <span>John Smith</span>
            </div>
        </div>

        <div class="complaints-list">
            <table class="complaints-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="complaintsTableBody">
                    <!-- Complaints will be displayed here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="../scripts/mycomplaints.js"></script>
</body>
</html>
