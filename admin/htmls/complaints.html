<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Complaints</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="../styles/complaints.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-logo">CMS</div>
            <ul class="sidebar-menu">
                <li><a href="admin2.html">Dashboard</a></li>
                <li><a href="complaints.html" class="active">Complaints</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#logout" class="btn btn-secondary">Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="dashboard-header">
                <h1>Complaint Management</h1>
                <div>Welcome, John Doe</div>
            </div>

            <!-- Complaints Section -->
            <div class="card">
                <!-- Filters -->
                <div class="complaints-filter">
                    <div class="filter-group">
                        <select id="departmentFilter" class="btn">
                            <option value="">All Departments</option>
                            <option value="hostel">Hostel</option>
                            <option value="it">IT</option>
                            <option value="electrical">Electrical</option>
                            <option value="cafeteria">Cafeteria</option>
                        </select>
                        <select id="statusFilter" class="btn">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                        </select>
                    </div>
                    <button id="createComplaintBtn" class="btn btn-secondary">Create Complaint</button>
                </div>

                <!-- Complaints Table -->
                <table class="complaints-table">
                    <thead>
                        <tr>
                            <th>Complaint ID</th>
                            <th>Student Name</th>
                            <th>Department</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                        <!-- Complaints will be dynamically populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Complaint Details Modal -->
    <div id="complaintModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Complaint Details</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div id="modalBody">
                <!-- Complaint details will be dynamically populated here -->
            </div>
            <div class="modal-footer">
                <button id="updateStatusBtn" class="btn">Update Status</button>
                <button id="closeModalBtn" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script src="../scripts/complaints.js"></script>
      <script src="theme.js"></script>
</body>
</html>
