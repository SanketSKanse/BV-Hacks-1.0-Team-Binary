<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Management System - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
            padding: 30px;
            text-align: center;
        }
        .login-container h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .user-type-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .user-type-btn {
            flex: 1;
            padding: 10px;
            margin: 0 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .user-type-btn:hover {
            background-color: #2980b9;
        }
        .login-form {
            display: none;
        }
        .login-form.active {
            display: block;
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .login-form button {
            width: 100%;
            padding: 10px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .login-form button:hover {
            background-color: #27ae60;
        }
        .switch-form {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }
        .switch-form a {
            color: #3498db;
            text-decoration: none;
        }
        .loginbutton {
            text-decoration: none;
            color: white;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <h1>Complaint Management System</h1>
        
        <div class="user-type-buttons">
            <button class="user-type-btn" onclick="showLoginForm('student')">Student Login</button>
            <button class="user-type-btn" onclick="showLoginForm('admin')">Admin Login</button>
        </div>

        <form id="studentLoginForm" class="login-form">
            <input type="email" id="studentEmail" placeholder="Student Email" required>
            <input type="password" id="studentPassword" placeholder="Password" required>
            <button type="submit"><a href="user/htmls/user.html" class="loginbutton">Login</a></button>
            <div class="switch-form">
                Not a student? <a href="#" onclick="showLoginForm('admin')">Admin Login</a>
            </div>
        </form>

        <form id="adminLoginForm" class="login-form">
            <input type="text" id="adminUsername" placeholder="Admin Username" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit"><a href="admin/htmls/admin2.html" class="loginbutton">Login</a></button>
            <div class="switch-form">
                Not an admin? <a href="#" onclick="showLoginForm('student')">Student Login</a>
            </div>
        </form>
    </div>

    <script>
       // Specified email and password stored in script.js
       const studentEmail = 'student@example.com';
        const studentPassword = 'password';
        const adminUsername = 'admin';
        const adminPassword = 'adminpassword';

        function showLoginForm(userType) {
            // Hide all login forms
            document.getElementById('studentLoginForm').classList.remove('active');
            document.getElementById('adminLoginForm').classList.remove('active');

            // Show selected login form
            if (userType === 'student') {
                document.getElementById('studentLoginForm').classList.add('active');
            } else {
                document.getElementById('adminLoginForm').classList.add('active');
            }
        }

        // Initially show student login form
        showLoginForm('student');

        // Add form submission event listeners
        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('studentEmail').value;
            const password = document.getElementById('studentPassword').value;

            // Validate login credentials
            if (email === studentEmail && password === studentPassword) {
                alert('Student Login Successful!');
                // Redirect to student dashboard or desired page
                window.location.href = '/user/htmls/user.html'; // Replace with your actual URL
            } else {
                alert('Student Login Failed. Invalid credentials.');
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;

            if (username === adminUsername && password === adminPassword) {
                alert('Admin Login Successful!');
                window.location.href = '/admin/htmls/admin2.html';
            } else {
                alert('Admin Login Failed. Invalid credentials.');
            }
        });
        
    </script>
</body>
</html>
